plugins {
    id 'com.android.application'
}

android {
    namespace 'com.m3ufree.sandboxgame'
    compileSdk 34

    defaultConfig {
        applicationId 'com.m3ufree.sandboxgame'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
